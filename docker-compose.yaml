#version: '3.8'
services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/html
    depends_on:
      - php
    restart: unless-stopped
  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    volumes:
      - ./src:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
  queue:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    container_name: laravel_queue
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - mysql
    command: php artisan queue:work --timeout=0
    restart: unless-stopped
  composer:
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
    volumes:
     - ./src:/var/www/html
  artisan:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    volumes:
      - ./src:/var/www/html
    entrypoint: ["php", "/var/www/html/artisan"]

  mysql:
    image: mysql:8.0
    volumes:
       - database:/var/lib/mysql 
       - ./src:/var/www/html
    ports:
      - "3316:3306"
    env_file:
      - env/mysql.env
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    env_file:
      - env/phpmyadmin.env
    restart: always
    ports:
      - 5555:80
  node:
    image: node:20-alpine
    ports:
        - "3000:3000"
    volumes:
        - ./src:/var/www/html
    working_dir: /var/www/html
    tty: true
volumes:
  database: